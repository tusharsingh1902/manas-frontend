<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chat | Project Manas</title>
  <link rel="stylesheet" href="chat.css" />
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f7a8c">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<header class="navbar">
  <div class="logo">Project Manas</div>
  <nav class="nav-links">
    <a href="#" onclick="goToInbox()">Back to Inbox</a>
    <button onclick="logout()" class="logout-btn">Logout</button>
  </nav>
</header>

<section class="chat-section">

  <div class="chat-header">
    <button class="back-btn" onclick="goBack()">&#8592;</button> 
    <h2 id="partnerName">Chat</h2>
  </div>

  <div id="messages" class="messages-box">
    <p class="loading">Loading chat...</p>
  </div>

  <div class="input-area">
    <input type="text" id="msgInput" placeholder="Type a message..." autocomplete="off" onkeypress="handleEnter(event)"/>
    <button onclick="sendMessage()" class="send-btn">&#10148;</button>
  </div>

</section>

<script>
/* --- CONFIGURATION --- */
const BACKEND_URL = "https://manas-backend-9gic.onrender.com";
const chatId = localStorage.getItem("currentChatId");
const role = localStorage.getItem("userType"); 
const myUsername = localStorage.getItem("username"); 
const partnerName = localStorage.getItem("chatPartner");
  alert("DEBUG CHECK:\nMy Chat ID is: " + chatId);

/* --- INITIAL CHECKS --- */
if (!chatId || !myUsername) {
  alert("Session Error. Redirecting.");
  goBack();
}

if (partnerName) {
  document.getElementById("partnerName").textContent = partnerName;
}
  async function markMessagesRead() {
    if (!chatId || !role) return;

    // 1. Choose the correct endpoint based on your existing Backend routes
    let endpoint = "";
    if (role === "student") {
        endpoint = `${BACKEND_URL}/chat/mark_read/student/${encodeURIComponent(chatId)}`;
    } else if (role === "mentor") {
        endpoint = `${BACKEND_URL}/chat/mark_read/mentor/${encodeURIComponent(chatId)}`;
    } else {
        console.warn("Unknown role, cannot mark messages as read.");
        return;
    }

    // 2. Call the server to reset the counter 
    try {
        await fetch(endpoint, { method: "POST" });
        console.log("Messages marked as read via:", endpoint);
    } catch (err) {
        console.error("Failed to mark messages as read:", err);
    }
}

markMessagesRead();

/* --- NAVIGATION LOGIC --- */
function goBack() {
  const userType = localStorage.getItem("userType");
  if (userType === 'mentor') {
    window.location.href = "mentor_inbox.html";
  } else {
    window.location.href = "student_inbox.html"; 
  }
}

function logout() {
  localStorage.clear();
  window.location.href = "login.html";
}

/* --- CHAT LOGIC --- */
let isFirstLoad = true;

async function loadChat() {
  const msgBox = document.getElementById("messages");
  // Check scroll position before adding messages
  const wasAtBottom = msgBox.scrollHeight - msgBox.scrollTop <= msgBox.clientHeight + 100;

  try {
    const res = await fetch(`${BACKEND_URL}/chat/${encodeURIComponent(chatId)}`);
    const data = await res.json();

    if (!data.messages || data.messages.length === 0) {
      if (msgBox.innerHTML.includes("Loading")) {
         msgBox.innerHTML = "<p style='text-align:center; color:#888; margin-top:20px;'>No messages yet. Say hi! 👋</p>";
      }
      return;
    }

    // Optimization: Stop if no new messages
    const currentCount = msgBox.querySelectorAll('.msg').length;
    if (data.messages.length === currentCount) return; 

    // Save scroll position
    const oldScroll = msgBox.scrollTop;
    msgBox.innerHTML = ""; // Clear and redraw (Simple method)

    data.messages.forEach(m => {
      const div = document.createElement("div");
      const isMine = (m.sender === myUsername);
      div.className = isMine ? "msg msg-right" : "msg msg-left";

      // Time Formatting
      const timeIST = new Date(m.timestamp).toLocaleTimeString("en-IN", {
        timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit", hour12: true
      });

     
/* We put text and span on the same line. 
   The &nbsp; adds a tiny safety space. */
div.innerHTML = `
  ${m.text}
  <span class="check-time">${timeIST}</span>
`;
      msgBox.appendChild(div);
    });

    // Smart Scroll: Only scroll down if user was already at bottom or it's first load
    if (isFirstLoad || wasAtBottom) {
        msgBox.scrollTop = msgBox.scrollHeight;
        isFirstLoad = false;
    } else {
        msgBox.scrollTop = oldScroll;
    }

  } catch (err) {
    console.error("Error loading chat:", err);
  }
}

async function sendMessage() {
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if (!text) return;

  // Optimistic UI: Add message instantly for better feel
  const msgBox = document.getElementById("messages");
  const tempDiv = document.createElement("div");
  tempDiv.className = "msg msg-right";
  tempDiv.innerHTML = `<p>${text}</p><span>Sending...</span>`;
  msgBox.appendChild(tempDiv);
  msgBox.scrollTop = msgBox.scrollHeight;
  
  const originalText = text;
  input.value = ""; // Clear input immediately

  try {
    const formData = new FormData();
    formData.append("chat_id", chatId);
    formData.append("sender", myUsername);
    formData.append("text", originalText);

    await fetch(`${BACKEND_URL}/chat/send`, { method: "POST", body: formData });
    
    loadChat(); // Refresh to get official server timestamp
  } catch(err) {
    alert("Failed to send message");
    input.value = originalText; // Restore text if failed
  }
}

function handleEnter(e) {
    if(e.key === "Enter") sendMessage();
}

/* --- BATTERY SAVER (Smart Polling) --- */
let chatInterval;

function startPolling() {
  loadChat(); // 
  if (!chatInterval) {
    chatInterval = setInterval(loadChat, 3000); 
  }
}

function stopPolling() {
  clearInterval(chatInterval);
  chatInterval = null;
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    stopPolling(); 
  } else {
    startPolling(); 
  }
});

// Start the engine
startPolling();
</script>
</body>
</html>
