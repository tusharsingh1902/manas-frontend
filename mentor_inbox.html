<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mentor Inbox | Project Manas</title>
  <link rel="stylesheet" href="mentor_inbox.css" />
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f7a8c">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<header class="navbar">
  <div class="logo">Project Manas</div>
  <nav class="nav-links">
    <a href="mentor_dashboard.html">Dashboard</a>
    <button onclick="logout()" class="logout-btn">Logout</button>
  </nav>
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
</header>

<section class="inbox-container">

  <div class="chat-list-panel">
    <h2>Your Students</h2>
    <div id="chatList" class="chat-list">
      <p class="loading">Loading chats...</p>
    </div>
  </div>

  <div class="chat-preview-panel">
    <h2>Chat Preview</h2>
    <div id="previewBox" class="preview-box">
      <p>Select a student from the left to preview messages.</p>
    </div>

    <button id="openChatBtn" class="open-chat-btn" style="display:none;">
      Open Full Chat
    </button>
  </div>

</section>

<script>
const BACKEND_URL = "https://manas-backend-9gic.onrender.com";

const username = localStorage.getItem("username");
const userType = localStorage.getItem("userType");

if (!username || userType !== "mentor") {
  alert("Session expired. Please login as a mentor.");
  window.location.href = "login.html";
}

const mentorEmail = username;
localStorage.setItem("role", "mentor");

async function loadChats() {
  try {
    const res = await fetch(`${BACKEND_URL}/chat/mentor/${mentorEmail}`);
    const data = await res.json();

    const chatList = document.getElementById("chatList");
    
    if(!chatList.innerHTML.includes("chat-item") && !data.chats) {
        chatList.innerHTML = "";
    }

    if (!data.chats || data.chats.length === 0) {
      chatList.innerHTML = "<p>No students have contacted you yet.</p>";
      return;
    }

    chatList.innerHTML = "";

    data.chats.forEach(chat => {
      const studentName = chat.student;
      const lastMsg = chat.last_message || "(no messages yet)";
      const unread = chat.unread_for_mentor || 0;

      const div = document.createElement("div");
      div.className = "chat-item";

      div.innerHTML = `
        <h3>${studentName}</h3>
        <p class="last-msg">${lastMsg}</p>
        ${unread > 0 ? `<span class="unread-badge">${unread}</span>` : ""}
      `;
            /* --- SMART CLICK LOGIC --- */
      div.onclick = () => {
        // 1. Save session details first
        localStorage.setItem("currentChatId", chat.chat_id);
        localStorage.setItem("chatPartner", studentName);
      
        // 2. Check Screen Size
        if (window.innerWidth <= 768) {
          // MOBILE: Go directly to the full chat page
          window.location.href = "chat.html";
        } else {
          // DESKTOP: Show the preview panel
          previewChat(chat.chat_id, studentName);
        }
      };
      chatList.appendChild(div);
    });
  } catch (err) {
    console.log("Error loading chats:", err);
  }
}

async function previewChat(chatId, studentName) {
  const preview = document.getElementById("previewBox");
  preview.innerHTML = "<p class='loading'>Loading messages...</p>";

  localStorage.setItem("currentChatId", chatId);
  localStorage.setItem("chatPartner", studentName);

  try {
  
    const res = await fetch(`${BACKEND_URL}/chat/${chatId}`);
    const data = await res.json();

    preview.innerHTML = "";

    if (!data.messages || data.messages.length === 0) {
      preview.innerHTML = "<p>No messages yet.</p>";
    } else {
      data.messages.forEach(m => {
        const div = document.createElement("div");
        div.className = "preview-msg";

        const timeIST = new Date(m.timestamp).toLocaleString("en-IN", {
            timeZone: "Asia/Kolkata",
            day: "2-digit",
            month: "short",
            hour: "2-digit",
            minute: "2-digit",
            hour12: true
        });

        div.innerHTML = `
          <strong>${m.sender === mentorEmail ? "You" : studentName}:</strong>
          <p>${m.text}</p>
          <span>${timeIST}</span>
        `;

        preview.appendChild(div);
      });
    }

    fetch(`${BACKEND_URL}/chat/mark_read/mentor/${chatId}`, { method: "POST" });

    const btn = document.getElementById("openChatBtn");
    btn.style.display = "block";
    btn.onclick = () => {
      window.location.href = "chat.html";
    };

  } catch (err) {
    preview.innerHTML = "<p>Error loading preview.</p>";
  }
}

function logout() {
  localStorage.clear();
  window.location.href = "login.html";
}

loadChats();
let inboxInterval;

function startInboxPolling() {
  loadChats(); 
  if (!inboxInterval) {
    inboxInterval = setInterval(loadChats, 4000); 
  }
}

function stopInboxPolling() {
  clearInterval(inboxInterval);
  inboxInterval = null;
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    stopInboxPolling();
  } else {
    startInboxPolling();
  }
});

startInboxPolling();
</script>
</body>
</html>
