<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manas AI Chatbot</title>

  <script src="auth.js" defer></script>

  <script defer>
    document.addEventListener("DOMContentLoaded", () => {
      window.ManasAuth.redirectIfNotLoggedIn("chatbot_preview.html");
    });
  </script>

  <link rel="stylesheet" href="chatbot.css" />
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
</head>

<body>

  <header class="navbar">
    <div class="logo">Project Manas</div>
    <nav class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="forum.html">Forum</a>
      <a href="stories.html">Stories</a>
      <!-- <button class="clear-btn" onclick="clearChat()">Clear Chat</button> -->
      <button class="logout-btn" onclick="logout()">Logout</button>
    </nav>
  </header>

  <section class="chat-section">
    <div class="chat-container" id="chatContainer">
      </div>

    <div id="typingIndicator" class="typing-indicator">
      <span></span><span></span><span></span>
    </div>

    <form id="chatForm">
      <input type="text" id="userInput" placeholder="Type your thoughts..." required autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </section>

  <footer class="footer">
    <p>ManasAI is for emotional support only — not a substitute for professional therapy.</p>
  </footer>

<script>
const BACKEND_URL = "https://manas-backend-9gic.onrender.com";
const chatContainer = document.getElementById("chatContainer");
const form = document.getElementById("chatForm");
const input = document.getElementById("userInput");
const typingIndicator = document.getElementById("typingIndicator");

  // Helper to convert Markdown symbols to HTML
function parseMarkdown(text) {
  // 1. Convert **text** to <strong>text</strong> (Bold)
  let html = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  
  // 2. Convert *text* to <em>text</em> (Italic)
  html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');

  // 3. Convert `code` to <code>code</code>
  html = html.replace(/`(.*?)`/g, '<code>$1</code>');
  
  return html;
}

// 1. Load History on Start
async function loadHistory() {
  const username = localStorage.getItem("username");
  if (!username) return;

  try {
    const res = await fetch(`${BACKEND_URL}/chatbot/history/${username}`);
    const data = await res.json();
    
    chatContainer.innerHTML = ""; 

    if (!data.messages || data.messages.length === 0) {
       appendMessage("bot-msg", "Hi, I’m <b>ManasAI</b>. How are you feeling today?");
    } else {
       data.messages.forEach(msg => {
          const style = (msg.role === "user") ? "user-msg" : "bot-msg";
          appendMessage(style, msg.content);
       });
       chatContainer.scrollTop = chatContainer.scrollHeight;
    }
  } catch (err) {
    console.error("History load failed", err);
    appendMessage("bot-msg", "Hi, I’m ManasAI. (Offline Mode)");
  }
}

// 2. Send Message Logic
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const userMsg = input.value.trim();
  const username = localStorage.getItem("username");
  
  if (!userMsg) return;

  appendMessage("user-msg", userMsg);
  input.value = "";
  
  // Show Typing Indicator
  chatContainer.appendChild(typingIndicator); 
  typingIndicator.style.display = "block";
  chatContainer.scrollTop = chatContainer.scrollHeight;

  const formData = new FormData();
  formData.append("username", username);
  formData.append("message", userMsg);

  try {
    const res = await fetch(`${BACKEND_URL}/chatbot`, { method: "POST", body: formData });
    const data = await res.json();
    
    typingIndicator.style.display = "none";
    appendMessage("bot-msg", data.reply);
    
  } catch {
    typingIndicator.style.display = "none";
    appendMessage("bot-msg", "Manas is sleeping (Server Error).");
  }
});

function appendMessage(className, text) {
  const div = document.createElement("div");
  div.className = className;
  div.innerHTML = parseMarkdown(text);
  
  if (typingIndicator.parentNode === chatContainer) {
    chatContainer.insertBefore(div, typingIndicator);
  } else {
    chatContainer.appendChild(div);
  }
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

function clearChat() {
  if(confirm("Clear local screen? (History stays on server).")) {
      chatContainer.innerHTML = "";
      appendMessage("bot-msg", "Screen cleared.");
  }
}

function logout() {
  localStorage.clear();
  window.location.href = "login.html";
}

loadHistory();
</script>

</body>
</html>
